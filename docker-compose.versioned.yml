version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: usdt-exchange-db
    environment:
      POSTGRES_DB: usdt_exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: https://github.com/${GITHUB_USER:-power19}/Exchange.git#${VERSION:-main}:backend
      args:
        NODE_ENV: production
    container_name: usdt-exchange-backend-${VERSION:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres123}@db:5432/usdt_exchange
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped
    command: sh -c "sleep 5 && npm run migrate && npm start"

  # Frontend Web App
  frontend:
    build:
      context: https://github.com/${GITHUB_USER:-power19}/Exchange.git#${VERSION:-main}:frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: usdt-exchange-frontend-${VERSION:-latest}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
